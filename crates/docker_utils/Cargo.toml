[package]
name = "docker_utils"
version = "0.4.0"
description = "Utilities for integration testsing with Docker"
readme = "README.md"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
categories.workspace = true
authors.workspace = true
license.workspace = true
# Exclude all bazel files as these conflict with Bazel workspace when vencored.
exclude = ["*.bazel", "*/*.bazel",  "*.bazel.*", "BUILD", "BUILD.bazel", "MODULE.bazel", ".bazelignore",".bazelrc", "tests/**/*"]


[lints]
workspace = true


[features]
# The gRPC health check strategy, the one wait that needs more than std.
grpc = ["wait_utils/grpc"]

[dependencies]
wait_utils = {workspace = true}

[dev-dependencies]
# One test proves a readiness probe may build a runtime of its own.
tokio = { workspace = true }
