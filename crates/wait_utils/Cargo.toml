[package]
name = "wait_utils"
version = "0.4.0"
description = "Utilities for implementing wait loops using varies wait strategies"
readme = "README.md"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
categories.workspace = true
authors.workspace = true
license.workspace = true
# Exclude all bazel files as these conflict with Bazel workspace when vencored.
exclude = ["*.bazel", "*/*.bazel",  "*.bazel.*", "BUILD", "BUILD.bazel", "MODULE.bazel", ".bazelignore",".bazelrc", "tests/**/*"]


[lints]
workspace = true


[features]
# The gRPC health check, the one strategy std cannot provide. It runs on a private runtime, so a caller sees no async.
grpc = ["dep:tokio", "dep:tonic", "dep:tonic-health"]

[dependencies]
tokio = { workspace = true, optional = true }
tonic = { workspace = true, optional = true }
tonic-health = { workspace = true, optional = true }
